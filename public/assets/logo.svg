<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <!-- Waveform Bars Gradient -->
    <linearGradient id="wave-grad-trans" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="40%" stop-color="#14b8a6" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle Neon Glow -->
    <filter id="wave-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Soundwave Bars (No Background, 100% Transparent) -->
  <g filter="url(#wave-glow)">
    <rect x="70" y="90" width="16" height="50" rx="8" fill="url(#wave-grad-trans)" opacity="0.65" />
    <rect x="100" y="60" width="16" height="110" rx="8" fill="url(#wave-grad-trans)" opacity="0.85" />
    <rect x="130" y="35" width="16" height="160" rx="8" fill="url(#wave-grad-trans)" />
    <rect x="160" y="15" width="16" height="200" rx="8" fill="url(#wave-grad-trans)" />
    <rect x="190" y="45" width="16" height="140" rx="8" fill="url(#wave-grad-trans)" />
    <rect x="220" y="20" width="16" height="190" rx="8" fill="url(#wave-grad-trans)" />
    <rect x="250" y="55" width="16" height="120" rx="8" fill="url(#wave-grad-trans)" opacity="0.9" />
    <rect x="280" y="75" width="16" height="80" rx="8" fill="url(#wave-grad-trans)" opacity="0.75" />
    <rect x="310" y="100" width="16" height="30" rx="8" fill="url(#wave-grad-trans)" opacity="0.55" />
  </g>

  <!-- Audis Text Underneath -->
  <text x="200" y="265" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="4" fill="#ffffff">
    AUDIS<tspan fill="#14b8a6">.</tspan>
  </text>
</svg>
