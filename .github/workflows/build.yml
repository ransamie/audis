name: Build & Release Audis Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Audis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Backend Tests
        run: npx vitest run tests/backend

      - name: Build Application Bundles
        run: npm run build

      - name: Package Desktop Installers (Branch Build — No Publish)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx electron-builder --publish never

      - name: Package & Publish Desktop Installers (Tag Release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

  release:
    name: Create Formal GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          RELEASE_NAME="Audis ${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$TAG_NAME" > release_notes.md
          if [ ! -s release_notes.md ]; then
            {
              printf '## Audis %s\n\n' "$GITHUB_REF_NAME"
              printf 'See the [README](https://github.com/ransamie/audis/blob/master/README.md) for full release notes and usage instructions.\n'
            } > release_notes.md
          fi

          # Publish draft release created by electron-builder --publish always, or create one
          if gh release view "$TAG_NAME" --json id --jq '.id' >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --draft=false \
              --latest \
              --title "$RELEASE_NAME" \
              --notes-file release_notes.md
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes-file release_notes.md \
              --latest
          fi
